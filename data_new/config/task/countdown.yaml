# @package _global_
# Countdown task configuration
# Selected via: python -m data_new task=countdown ...

task:
  name: countdown

# Dataset generation parameters (at root level, not under task)
dataset:
  # Number of examples per operand count: {num_operands: count}
  num_samples:
    4: 500  # 500 puzzles with 4 operands
    5: 500  # 500 puzzles with 5 operands
    6: 500  # 500 puzzles with 6 operands

  # Range for random numbers in puzzles
  number_range:
    - 1
    - 100

  # Range for target values
  target_range:
    - 10
    - 1000
