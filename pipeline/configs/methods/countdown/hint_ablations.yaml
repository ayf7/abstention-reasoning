name: hint_ablations
template_variant: hint_ablations
reward_function: compute_score_hint
multi_turn: true
max_turns: 6
mask_response_tokens: true  # Mask <response>...</response> tokens during SFT
# Forced hint requests get no canned lead-in phrase, so <request></request> has
# to be predicted from the reasoning state rather than triggered by a memorised
# cue. This is the countdown port of competition_math/hint_ablations.
hint_transition: false
# The request lives inside the think block, so </think> is reached exactly once,
# immediately before <answer>. That is what makes the counterfactual eval
# possible: `evaluate --no-hints` bans the request token and leaves the model
# still mid-reasoning rather than stranded past its own </think>.
nested_request: true
reward_kwargs:
  hint_penalty: 0.1
  format_score: 0.1
