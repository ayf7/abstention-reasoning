name: hint
template_variant: hint
reward_function: compute_score_hint
multi_turn: true
max_turns: 6
mask_response_tokens: true
# The one thing v2 changes: forced hint requests get no canned lead-in phrase,
# so <request></request> has to be predicted from the reasoning state.
hint_transition: false
reward_kwargs:
  hint_penalty: 0.1
  format_score: 0.1
