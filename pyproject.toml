[project]
name = "abstention-reasoning"
version = "0.1.0"
description = "Abstention Reasoning"
readme = "README.md"
requires-python = ">=3.10.12"
authors = [{ name = "Anthony Fei", email = "ayf7@cornell.edu" }]

dependencies = [
  "torch>=2.1",
  "transformers",
  "matplotlib",
  "tqdm",
  "numpy",
  "accelerate",
  # 1.x defaults loss_type="chunked_nll", whose _patch_chunked_ce_lm_head does
  # inspect.signature(model.forward.__func__); forward is a functools.partial here,
  # so SFT dies with AttributeError. 0.27.2 is what requirements.lock.txt pins and
  # what pipeline/commands/training.py was written against.
  "trl==0.27.2",
  "wandb",
  "vllm==0.15.0",
  "math-verify[antlr4_9_3]",
  "datasets",
  "pyyaml",
  "pandas",
  "openai",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
